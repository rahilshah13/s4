version: '3.8'

services:
  nginx-proxy:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - s4_data:/data/s4
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /data/s4/certs
        # Bootstrap a temporary self-signed cert if none exists so Nginx starts normally
        if [ ! -f /data/s4/certs/fullchain.pem ]; then
          apk add --no-cache openssl > /dev/null 2>&1
          openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
            -keyout /data/s4/certs/privkey.pem \
            -out /data/s4/certs/fullchain.pem \
            -subj "/CN=yourdomain.com"
        fi
        
        # Background watcher to detect when s4-gateway updates certificates and reload Nginx
        (
          LAST_MOD=""
          while true; do
            CURRENT_MOD=$(stat -c %Y /data/s4/certs/fullchain.pem 2>/dev/null)
            if [ "$LAST_MOD" != "" ] && [ "$CURRENT_MOD" != "$LAST_MOD" ]; then
              nginx -s reload
            fi
            LAST_MOD="$CURRENT_MOD"
            sleep 3600
          done
        ) &
        
        exec nginx -g 'daemon off;'
    depends_on:
      - s4-gateway
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

  s4-gateway:
    image: s4:latest
    build: .
    expose:
      - "8080"
    volumes:
      - s4_data:/data/s4
    environment:
      - S4_PORT=8080
      - S4_DB_PATH=/data/s4/s4_metadata.db
      - S4_STORAGE_PATH=/data/s4/objects
      - S4_CERTS_PATH=/data/s4/certs
      - S4_DOMAIN=yourdomain.com
      - S4_CONTACT_EMAIL=admin@yourdomain.com
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  s4_data:
    driver: local
